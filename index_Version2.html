<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact DaBigJonh</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      background: #000000;
      font-family: 'Lato', sans-serif;
      color: #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
      animation: pageLoad 0.5s ease-out;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000000;
      pointer-events: none;
      z-index: 0;
    }
    
    .form-container {
      background: #000000;
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 
        0 25px 50px rgba(0, 240, 255, 0.2),
        0 0 0 1px rgba(0, 240, 255, 0.1),
        inset 0 1px 0 rgba(0, 240, 255, 0.1);
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s ease;
      animation: slideUpFadeIn 0.8s ease-out forwards;
    }
    
    @keyframes slideUpFadeIn {
      0% {
        transform: translateY(100px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .form-container:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 35px 70px rgba(0, 240, 255, 0.3),
        0 0 0 1px rgba(0, 240, 255, 0.2),
        inset 0 1px 0 rgba(0, 240, 255, 0.15);
    }
    
    .form-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, transparent, rgba(0, 240, 255, 0.1), transparent);
      border-radius: 22px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .form-container:hover::before {
      opacity: 1;
    }
    
    .form-container h2 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 28px;
      font-weight: 900;
      color: #00f0ff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
      letter-spacing: 1px;
      position: relative;
      transform: translateY(30px);
      opacity: 0;
      animation: slideUpFadeIn 0.8s ease-out 0.2s forwards;
    }
    
    .form-container h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00f0ff, transparent);
      border-radius: 2px;
    }
    
    .form-group {
      margin-bottom: 25px;
      position: relative;
      transform: translateY(30px);
      opacity: 0;
    }
    
    .form-group:nth-child(1) {
      animation: slideUpFadeIn 0.8s ease-out 0.4s forwards;
    }
    
    .form-group:nth-child(2) {
      animation: slideUpFadeIn 0.8s ease-out 0.6s forwards;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }
    
    .input-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }
    
    .input-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.1), transparent);
      transition: left 0.5s ease;
      z-index: 1;
      pointer-events: none;
    }
    
    .input-wrapper:focus-within::before {
      left: 100%;
    }
    
    input[type="email"],
    textarea {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid rgba(0, 240, 255, 0.2);
      border-radius: 10px;
      background: #000000;
      color: #00f0ff;
      font-size: 16px;
      font-family: 'Lato', sans-serif;
      font-weight: 400;
      outline: none;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }
    
    input[type="email"]:focus,
    textarea:focus {
      border-color: #00f0ff;
      background: #000000;
      box-shadow: 
        0 0 0 3px rgba(0, 240, 255, 0.1),
        inset 0 0 20px rgba(0, 240, 255, 0.05);
      transform: translateY(-2px);
    }
    
    input[type="email"]::placeholder,
    textarea::placeholder {
      color: rgba(0, 240, 255, 0.4);
      transition: color 0.3s ease;
    }
    
    input[type="email"]:focus::placeholder,
    textarea:focus::placeholder {
      color: rgba(0, 240, 255, 0.6);
    }
    
    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: 'Lato', sans-serif;
    }
    
    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #00f0ff 0%, #00d9ff 100%);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 900;
      font-family: 'Lato', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      transform: translateY(30px);
      opacity: 0;
      animation: slideUpFadeIn 0.8s ease-out 0.8s forwards;
    }
    
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .submit-btn:hover {
      background: linear-gradient(135deg, #00d9ff 0%, #00c4ff 100%);
      transform: translateY(-3px);
      box-shadow: 
        0 15px 30px rgba(0, 240, 255, 0.4),
        0 0 20px rgba(0, 240, 255, 0.2);
    }
    
    .submit-btn:hover::before {
      left: 100%;
    }
    
    .submit-btn:active {
      transform: translateY(-1px);
    }
    
    .floating-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #00f0ff;
      border-radius: 50%;
      opacity: 0;
      animation: float 6s ease-in-out infinite, particleFadeIn 1s ease-out forwards;
    }
    
    @keyframes particleFadeIn {
      0% { opacity: 0; }
      100% { opacity: 0.3; }
    }
    
    .particle:nth-child(1) { left: 10%; animation-delay: 0s, 1s; }
    .particle:nth-child(2) { left: 20%; animation-delay: 1s, 1.2s; }
    .particle:nth-child(3) { left: 30%; animation-delay: 2s, 1.4s; }
    .particle:nth-child(4) { left: 40%; animation-delay: 3s, 1.6s; }
    .particle:nth-child(5) { left: 50%; animation-delay: 4s, 1.8s; }
    .particle:nth-child(6) { left: 60%; animation-delay: 5s, 2s; }
    .particle:nth-child(7) { left: 70%; animation-delay: 0.5s, 2.2s; }
    .particle:nth-child(8) { left: 80%; animation-delay: 1.5s, 2.4s; }
    .particle:nth-child(9) { left: 90%; animation-delay: 2.5s, 2.6s; }
    
    @keyframes float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(180deg); }
    }
    
    @media (max-width: 600px) {
      .form-container {
        padding: 30px;
        margin: 10px;
      }
      
      .form-container h2 {
        font-size: 24px;
      }
      
      input[type="email"],
      textarea {
        padding: 14px 16px;
        font-size: 15px;
      }
      
      .submit-btn {
        padding: 16px;
        font-size: 16px;
      }
    }
    
    @keyframes pageLoad {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="floating-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <div class="form-container">
    <h2>💬 Message DaBigJonh</h2>
    <form action="https://formspree.io/f/xldnlqeb" method="POST">
      <div class="form-group">
        <label for="email">Your Email:</label>
        <div class="input-wrapper">
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="message">Your Message:</label>
        <div class="input-wrapper">
          <textarea id="message" name="message" placeholder="What would you like to say?" required></textarea>
        </div>
      </div>
      
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>
</body>
</html>
